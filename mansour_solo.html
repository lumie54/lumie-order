<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#B08D57">
<title>르미에 만수르창고 — 혼자 방송</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F5EFE6; --card:#FFFFFF; --soft:#FBF7F0; --ink:#3E332A; --sub:#8A7A68;
  --accent:#B08D57; --accent-dark:#8F6F3F; --line:#E5DACB; --danger:#B3402E; --ok:#4E7A4E; --live:#D33;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1100px;margin:0 auto;padding:10px 12px 40px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.top h1{font-size:16px;font-weight:800;}
.top .st{font-size:12px;color:var(--sub);}
.top .st b{color:var(--ok);}
.grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:820px){ .grid{grid-template-columns:1.05fr 1fr;} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.lbl{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(221,51,51,.55);}70%{box-shadow:0 0 0 8px rgba(221,51,51,0);}100%{box-shadow:0 0 0 0 rgba(221,51,51,0);}}

/* 지금 고객 화면에 떠 있는 상품 */
.now{display:flex;gap:12px;align-items:center;}
.now img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft);flex:0 0 96px;}
.now .no{font-size:28px;font-weight:900;color:var(--live);line-height:1;}
.now .nm{font-size:15px;font-weight:700;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.now .pr{font-size:17px;font-weight:800;color:var(--accent-dark);margin-top:2px;}
.now .sold{display:inline-block;background:var(--danger);color:#fff;font-size:12px;font-weight:800;border-radius:12px;padding:2px 8px;margin-left:4px;vertical-align:middle;}
.nowbtns{display:flex;gap:8px;margin-top:10px;}
.nowbtns button{flex:1;border-radius:10px;padding:11px 6px;font-size:14px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
.nowbtns .bsold{border-color:#E7C8C0;color:var(--danger);}
.nowbtns .bsold.on{border-color:var(--ok);color:var(--ok);}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:14px;}

/* 번호 입력 + 미리보기 */
.pad-top{display:flex;gap:10px;align-items:stretch;}
.numbox{flex:0 0 132px;background:var(--soft);border:2px solid var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;letter-spacing:1px;min-height:84px;color:var(--ink);}
.numbox.empty{color:#C9BBA8;font-size:20px;font-weight:700;}
.prev{flex:1;min-width:0;display:flex;gap:9px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:8px;}
.prev img{width:66px;height:66px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 66px;background:var(--soft);}
.prev .nm{font-size:13.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.prev .pr{font-size:14.5px;font-weight:800;color:var(--accent-dark);}
.prev .warn{font-size:12.5px;font-weight:800;color:var(--danger);}
.prev .opt{font-size:11.5px;color:var(--sub);}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.keys button{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:24px;font-weight:800;padding:12px 0;color:var(--ink);}
.keys button:active{background:var(--soft);}
.keys .k-del{font-size:18px;color:var(--sub);}
.go{display:grid;grid-template-columns:1fr 2fr 1fr;gap:7px;margin-top:8px;}
.go button{border:0;border-radius:12px;font-size:16px;font-weight:900;padding:16px 4px;}
.b-prev,.b-next{background:var(--soft);color:var(--accent-dark);border:1.5px solid var(--accent) !important;}
.b-push{background:var(--live);color:#fff;font-size:19px !important;}
.b-push:disabled{opacity:.45;}
.hint{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5;}

/* 검색 · 최근 */
.search{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;}
.search:focus{outline:none;border-color:var(--accent);}
.row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:0;}
.row img{width:42px;height:42px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:0 0 42px;background:var(--soft);}
.row .tx{flex:1;min-width:0;}
.row .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{font-size:12px;color:var(--sub);}
.row.top .nm{color:var(--live);}
.mini{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:800;color:var(--sub);}
.mini.push{border-color:var(--live);color:var(--live);}
.mini.sold{border-color:#E7C8C0;color:var(--danger);}
.mini.unsold{border-color:var(--ok);color:var(--ok);}
.foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.foot button{flex:1;border:1.5px solid #E7C8C0;background:#fff;color:var(--danger);border-radius:10px;padding:10px;font-size:13px;font-weight:800;}
.foot a{flex:1;text-align:center;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:10px;padding:10px;font-size:13px;font-weight:800;text-decoration:none;}

.pin{position:fixed;inset:0;background:rgba(62,51,42,.55);display:none;align-items:center;justify-content:center;z-index:80;}
.pin.show{display:flex;}
.pin .box{background:#fff;border-radius:14px;padding:20px;width:min(340px,90vw);}
.pin input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:18px;margin:10px 0;text-align:center;}
.pin button{width:100%;border:0;border-radius:10px;padding:13px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:15px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.bad{background:var(--danger);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🏪 만수르창고 · 혼자 방송</h1>
    <div class="st" id="st">불러오는 중…</div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="lbl"><span class="dot"></span> 지금 고객 화면 맨 위</div>
        <div id="nowBox"><div class="empty">아직 띄운 상품이 없어요</div></div>
      </div>

      <div class="card" style="margin-top:10px;">
        <div class="lbl">🔢 번호 누르고 ▶ 띄우기</div>
        <div class="pad-top">
          <div class="numbox empty" id="numbox">번호</div>
          <div class="prev" id="prev"><div class="hint" style="margin:0;">번호를 누르면 여기에 상품이 보여요</div></div>
        </div>
        <div class="keys" id="keys"></div>
        <div class="go">
          <button class="b-prev" onclick="step(-1)">◀ 이전</button>
          <button class="b-push" id="btnPush" onclick="pushTyped()">▶ 띄우기</button>
          <button class="b-next" onclick="step(1)">다음 ▶</button>
        </div>
        <p class="hint">이전 · 다음은 지금 떠 있는 번호 기준으로 바로 앞 · 뒤 상품을 <b>바로 띄워요</b>. 품절 상품은 건너뛰어요.<br>키보드로도 돼요: 숫자 → Enter 띄우기 · ←/→ 이전/다음 · Esc 지우기</p>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="lbl">🔍 이름으로 찾기</div>
        <input class="search" id="q" placeholder="예) 곤약, 코렐, 테팔" oninput="renderSearch()" autocomplete="off">
        <div id="hits"></div>
      </div>

      <div class="card" style="margin-top:10px;">
        <div class="lbl">📺 띄운 순서 <span id="liveCnt" style="font-weight:700;"></span></div>
        <div id="liveList"></div>
        <div class="foot">
          <button onclick="clearAll()">🧹 방송 시작 — 목록 초기화</button>
          <a href="mansour.html" target="_blank">고객 화면 열기 ↗</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="pin" id="pinBox">
  <div class="box">
    <b>🔐 방송 제어 비밀번호</b>
    <p class="hint">가방 · 만수르 방송 제어와 같은 비밀번호예요. 이 기기에 저장됩니다.</p>
    <input type="password" id="pinIn" inputmode="numeric" placeholder="비밀번호">
    <button onclick="savePin()">저장</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  SHEET_URL: "https://script.google.com/macros/s/AKfycbypIdAUuQc6P793mJFNderKR2ymg_kFJniK6cOR-M3M9ej1Nj34TeaeFNML5tRGpUFU/exec",
  POLL_MS: 6000,
};
const $ = id => document.getElementById(id);
const PIN_KEY = "lumie_admin_pin";
const won = n => (Number(n)||0).toLocaleString("ko-KR") + "원";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PRODUCTS = [], BYNO = {}, NOS = [], LIVE = [], OPTS = {}, loaded = false, busy = false, typed = "", lastRaw = "", lastLive = "";

function toast(msg, bad){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(()=>t.className = "toast", 1800); }
function pin(){ try{ return localStorage.getItem(PIN_KEY) || ""; }catch(e){ return window._pin || ""; } }
function savePin(){
  const v = $("pinIn").value.trim(); if(!v){ toast("비밀번호를 입력하세요", true); return; }
  try{ localStorage.setItem(PIN_KEY, v); }catch(e){ window._pin = v; }
  $("pinBox").classList.remove("show"); toast("저장됐어요");
}
function shortName(p){ return String(p.name || "").replace(/^\d+\s*\.\s*/, ""); }
function img(p){ return p && p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<img alt="" style="visibility:hidden">`; }

/* ---------- 데이터 ---------- */
async function loadCatalog(){
  try{
    const res = await fetch(CONFIG.SHEET_URL + "?mode=mncat&t=" + Date.now());
    const raw = await res.text();
    if(raw === lastRaw) return;
    const data = JSON.parse(raw); lastRaw = raw;
    const base = String(data.base || "");
    PRODUCTS = (data.items||[]).map(r => {
      let im = String(r.img||""); if(im && !/^https?:\/\//.test(im)) im = base + im;
      const prev = BYNO[Number(r.no)];
      return { no: Number(r.no)||0, name: String(r.name||""), price: Number(r.price)||0, img: im, soldout: prev ? prev.soldout : Number(r.soldout)===1 };
    }).filter(p => p.no);
    BYNO = {}; PRODUCTS.forEach(p => BYNO[p.no] = p);
    NOS = PRODUCTS.map(p => p.no).filter((v,i,a) => a.indexOf(v) === i).sort((a,b) => a-b);
    loaded = true;
    renderAll();
  }catch(e){ console.error(e); $("st").innerHTML = "<span style='color:var(--danger)'>상품 불러오기 실패 — 새로고침</span>"; }
}
async function loadLive(force){
  try{
    const res = await fetch(CONFIG.SHEET_URL + "?mode=mnlive&t=" + Date.now());
    const raw = await res.text();
    if(!force && raw === lastLive) return;
    lastLive = raw;
    const data = JSON.parse(raw);
    LIVE = (data.live || []);
    if(Array.isArray(data.sold)){ const s = new Set(data.sold.map(Number)); PRODUCTS.forEach(p => p.soldout = s.has(p.no)); }
    const d = new Date(); $("st").innerHTML = "<b>●</b> 연결됨 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" + String(d.getSeconds()).padStart(2,"0");
    renderAll();
  }catch(e){ console.error(e); $("st").innerHTML = "<span style='color:var(--danger)'>연결 끊김 — 재시도 중</span>"; }
}
fetch("mansour_opts.json?t=" + Date.now()).then(r => r.ok ? r.json() : {}).then(j => { OPTS = j || {}; renderAll(); }).catch(()=>{});

/* ---------- 화면 ---------- */
function curNo(){ return LIVE[0] ? Number(LIVE[0].no) : 0; }
function renderNow(){
  const n = curNo(), p = BYNO[n];
  if(!n){ $("nowBox").innerHTML = '<div class="empty">아직 띄운 상품이 없어요</div>'; return; }
  const nm = (LIVE[0].name || (p && p.name) || (n + "번"));
  const pr = LIVE[0].price || (p && p.price) || 0;
  const sold = p && p.soldout;
  $("nowBox").innerHTML = `
    <div class="now">${img(p)}
      <div style="min-width:0;flex:1;">
        <div class="no">${n}번 ${sold ? '<span class="sold">품절</span>' : ""}</div>
        <div class="nm">${esc(String(nm).replace(/^\d+\s*\.\s*/, ""))}</div>
        <div class="pr">${won(pr)}</div>
      </div>
    </div>
    <div class="nowbtns">
      <button class="bsold ${sold ? "on" : ""}" onclick="toggleSold(${n})">${sold ? "✅ 품절 해제" : "⛔ 품절 처리"}</button>
      <button onclick="editPrice(${n})">✏️ 가격 바꿔 다시 띄우기</button>
    </div>`;
}
function renderTyped(){
  const nb = $("numbox");
  nb.textContent = typed || "번호"; nb.classList.toggle("empty", !typed);
  const box = $("prev");
  if(!typed){ box.innerHTML = '<div class="hint" style="margin:0;">번호를 누르면 여기에 상품이 보여요</div>'; $("btnPush").disabled = false; return; }
  const p = BYNO[Number(typed)];
  if(!p){ box.innerHTML = `<div class="warn">${esc(typed)}번 상품이 목록에 없어요</div>`; $("btnPush").disabled = true; return; }
  $("btnPush").disabled = false;
  const o = OPTS[p.no];
  box.innerHTML = `${img(p)}<div style="min-width:0;">
      <div class="nm">${esc(shortName(p))}</div>
      <div class="pr">${won(p.price)}</div>
      ${o ? `<div class="opt">${esc(o.label || "옵션")}: ${esc(o.values.join(" · "))}</div>` : ""}
      ${p.soldout ? '<div class="warn">⛔ 품절 상태 — 띄우면 판매종료로 보여요</div>' : ""}
      ${curNo() === p.no ? '<div class="opt">지금 떠 있는 상품이에요</div>' : ""}
    </div>`;
}
function rowHtml(p, extra, isTop){
  return `<div class="row ${isTop ? "top" : ""}">${img(p)}
    <div class="tx"><div class="nm">${p.no}. ${esc(shortName(p))}</div><div class="sub">${won(p.price)}${p.soldout ? " · <b style='color:var(--danger)'>품절</b>" : ""}${extra || ""}</div></div>
    <button class="mini ${p.soldout ? "unsold" : "sold"}" onclick="toggleSold(${p.no})">${p.soldout ? "해제" : "품절"}</button>
    <button class="mini push" onclick="push(${p.no})">▶</button>
  </div>`;
}
function renderLive(){
  $("liveCnt").textContent = LIVE.length ? "(" + LIVE.length + "개)" : "";
  if(!LIVE.length){ $("liveList").innerHTML = '<div class="empty">아직 없어요</div>'; return; }
  $("liveList").innerHTML = LIVE.slice(0, 30).map((l, i) => {
    const p = BYNO[l.no] || { no: l.no, name: l.name || "", price: l.price || 0, img: "" };
    const t = /^\d{2}:\d{2}/.test(l.ts || "") ? " · " + l.ts.slice(0,5) : "";
    return rowHtml(p, t, i === 0);
  }).join("") + (LIVE.length > 30 ? `<div class="hint" style="text-align:center;">이전 ${LIVE.length - 30}개 생략</div>` : "");
}
function renderSearch(){
  const q = $("q").value.trim().toLowerCase().replace(/\s/g, "");
  if(!q || !loaded){ $("hits").innerHTML = ""; return; }
  const isNum = /^\d+$/.test(q);
  const hits = PRODUCTS.filter(p => (isNum && String(p.no) === q) || p.name.toLowerCase().replace(/\s/g, "").indexOf(q) > -1).slice(0, 12);
  $("hits").innerHTML = hits.length ? hits.map(p => rowHtml(p, "")).join("") : '<div class="empty">검색 결과가 없어요</div>';
}
function renderAll(){ if(!loaded) return; renderNow(); renderTyped(); renderLive(); renderSearch(); }

/* ---------- 키패드 ---------- */
(function buildKeys(){
  const ks = ["1","2","3","4","5","6","7","8","9","C","0","⌫"];
  $("keys").innerHTML = ks.map(k => `<button class="${k === "⌫" || k === "C" ? "k-del" : ""}" onclick="key('${k}')">${k === "C" ? "지움" : k}</button>`).join("");
})();
function key(k){
  if(k === "⌫") typed = typed.slice(0, -1);
  else if(k === "C") typed = "";
  else if(typed.length < 4) typed = (typed === "0" ? "" : typed) + k;
  renderTyped();
}
document.addEventListener("keydown", e => {
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(/^[0-9]$/.test(e.key)){ key(e.key); e.preventDefault(); }
  else if(e.key === "Backspace"){ key("⌫"); e.preventDefault(); }
  else if(e.key === "Escape"){ key("C"); }
  else if(e.key === "Enter"){ pushTyped(); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ step(1); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ step(-1); e.preventDefault(); }
});

/* ---------- 동작 ---------- */
async function call(params){
  if(!pin()){ $("pinBox").classList.add("show"); return null; }
  if(busy){ toast("⏳ 앞 작업 처리 중…", true); return null; }
  busy = true;
  try{
    const qs = Object.keys(params).map(k => k + "=" + encodeURIComponent(params[k])).join("&");
    const res = await fetch(CONFIG.SHEET_URL + "?mode=mnctl&pin=" + encodeURIComponent(pin()) + "&" + qs + "&t=" + Date.now());
    const j = await res.json();
    if(!j.ok){
      toast(j.msg || "실패", true);
      if(/pin|비밀번호/i.test(j.msg || "")){ try{ localStorage.removeItem(PIN_KEY); }catch(e){} $("pinBox").classList.add("show"); }
      return null;
    }
    return j;
  }catch(e){ console.error(e); toast("통신 실패 — 다시 눌러주세요", true); return null; }
  finally{ busy = false; setTimeout(() => loadLive(true), 300); }
}
async function push(no, price){
  const p = BYNO[no]; if(!p){ toast(no + "번 상품이 없어요", true); return; }
  const pr = price || p.price;
  // 누르자마자 화면 먼저 바꿈 (응답 기다리지 않음)
  const prevLive = LIVE.slice();
  LIVE = [{ seq: (LIVE[0] ? LIVE[0].seq + 1 : 1), no: no, name: p.name, price: pr, ts: "" }].concat(LIVE.filter(l => Number(l.no) !== no));
  typed = ""; renderAll();
  toast("📺 " + no + "번 띄우는 중…");
  const r = await call({ action: "push", no: no, name: p.name, price: pr });
  if(r){ if(price) p.price = price; toast("✅ " + no + "번 떴어요"); }
  else { LIVE = prevLive; renderAll(); }
}
function pushTyped(){
  if(!typed){ toast("번호를 먼저 누르세요", true); return; }
  const n = Number(typed);
  if(!BYNO[n]){ toast(n + "번 상품이 없어요", true); return; }
  push(n);
}
function step(d){
  if(!NOS.length) return;
  let base = typed ? Number(typed) : curNo();
  let i = NOS.indexOf(base);
  if(i < 0){
    const j = NOS.findIndex(n => n > base);          // base 보다 큰 첫 번호
    const at = j < 0 ? NOS.length : j;
    i = d > 0 ? at - 1 : at;                          // 아래에서 i += d
  }
  for(let k = 0; k < NOS.length; k++){
    i += d;
    if(i < 0 || i >= NOS.length){ toast(d > 0 ? "마지막 번호예요" : "첫 번호예요", true); return; }
    const p = BYNO[NOS[i]];
    if(p && !p.soldout){ push(p.no); return; }
  }
}
async function toggleSold(no){
  const p = BYNO[no]; if(!p) return;
  const toSold = !p.soldout;
  p.soldout = toSold; renderAll();
  const r = await call({ action: toSold ? "soldout" : "restock", no: no });
  if(r) toast(toSold ? "⛔ " + no + "번 품절" : "✅ " + no + "번 품절 해제");
  else { p.soldout = !toSold; renderAll(); }
}
function editPrice(no){
  const p = BYNO[no]; if(!p) return;
  const v = prompt(no + "번 " + shortName(p) + "\n\n방송 가격을 입력하세요 (숫자만)", String(p.price));
  if(v === null) return;
  const n = Number(String(v).replace(/[^0-9]/g, ""));
  if(!n){ toast("가격을 확인해주세요", true); return; }
  push(no, n);
}
async function clearAll(){
  if(!confirm("띄운 상품 목록을 전부 지웁니다. (주문에는 영향 없음)\n방송 시작 전에만 눌러주세요.")) return;
  const r = await call({ action: "clear" });
  if(r){ LIVE = []; renderAll(); toast("초기화 완료"); }
}

/* 화면 꺼짐 방지 */
let wl = null;
async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState === "visible") wl = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); loadLive(true); } });
keepAwake();

if(!pin()) $("pinBox").classList.add("show");
loadCatalog().then(() => loadLive(true));
setInterval(loadLive, CONFIG.POLL_MS);
setInterval(loadCatalog, 60000);
</script>
